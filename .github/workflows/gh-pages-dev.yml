name: Deploy dev preview to GitHub Pages

on:
  workflow_run:
    workflows: [Build, Test]
    branches: [dev]
    types: [completed]

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.validation.outputs.ready }}
      build_run_id: ${{ steps.validation.outputs.build_run_id }}
      dev_base_path: ${{ steps.validation.outputs.dev_base_path }}
      destination_dir: ${{ steps.validation.outputs.destination_dir }}
    steps:
      - name: Verify full validation for the same dev SHA
        id: validation
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;

            const { data: devBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'dev',
            });

            if (devBranch.commit.sha !== sha) {
              core.info(`Skipping ${sha}: dev has already advanced to ${devBranch.commit.sha}.`);
              core.setOutput('ready', 'false');
              return;
            }

            const requiredWorkflows = ['build.yml', 'test.yml'];
            const successfulRuns = new Map();

            for (const workflow_id of requiredWorkflows) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                branch: 'dev',
                event: 'push',
                head_sha: sha,
                per_page: 10,
              });

              const run = data.workflow_runs
                .filter(candidate =>
                  candidate.head_sha === sha &&
                  candidate.head_branch === 'dev' &&
                  candidate.event === 'push'
                )
                .sort((left, right) => new Date(right.updated_at) - new Date(left.updated_at))[0];

              if (!run) {
                core.info(`${workflow_id}: no push run found for ${sha}.`);
                core.setOutput('ready', 'false');
                return;
              }

              core.info(`${workflow_id}: ${run.status}/${run.conclusion} (run ${run.id}).`);

              if (run.status !== 'completed' || run.conclusion !== 'success') {
                core.setOutput('ready', 'false');
                return;
              }

              successfulRuns.set(workflow_id, run);
            }

            const { data: configFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'apps/standalone/deployment.config.json',
              ref: sha,
            });

            if (Array.isArray(configFile) || configFile.type !== 'file' || !configFile.content) {
              throw new Error('Standalone deployment configuration is not a readable file.');
            }

            const deploymentConfig = JSON.parse(
              Buffer.from(configFile.content, 'base64').toString('utf8')
            );
            const devBasePath = deploymentConfig.dev?.basePath;

            if (
              typeof devBasePath !== 'string' ||
              !/^\/(?!(?:\.{1,2}|\.git)\/$)[A-Za-z0-9._~-]+\/$/i.test(devBasePath)
            ) {
              throw new Error(`Invalid dev Pages base path: ${String(devBasePath)}`);
            }

            const destinationDir = devBasePath.slice(1, -1);

            core.setOutput('ready', 'true');
            core.setOutput('build_run_id', String(successfulRuns.get('build.yml').id));
            core.setOutput('dev_base_path', devBasePath);
            core.setOutput('destination_dir', destinationDir);

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated standalone preview
        uses: actions/download-artifact@v8
        with:
          name: standalone-pages-${{ github.event.workflow_run.head_sha }}
          path: apps/standalone/dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.build_run_id }}
      - name: Checkout current Pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-current
          persist-credentials: false
      - name: Resolve previously deployed preview
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const statePath = 'gh-pages-current/.skincrafter-pages-state.json';
          const fallbackPath = 'gh-pages-current/404.html';
          let previousBasePath;
          let previousDestinationDir;

          if (fs.existsSync(statePath)) {
            const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
            previousBasePath = state.devBasePath;
            previousDestinationDir = state.devDestinationDir;
          } else if (fs.existsSync(fallbackPath)) {
            const fallback = fs.readFileSync(fallbackPath, 'utf8');
            const previewMatch = fallback.match(/var previewBase = ['"]([^'"]+)['"];/);

            if (previewMatch) {
              previousBasePath = previewMatch[1];
              previousDestinationDir = previousBasePath.slice(1, -1);
            }
          }

          if (previousBasePath === undefined && previousDestinationDir === undefined) {
            process.exit(0);
          }

          if (
            typeof previousBasePath !== 'string' ||
            !/^\/(?!(?:\.{1,2}|\.git)\/$)[A-Za-z0-9._~-]+\/$/i.test(previousBasePath) ||
            previousDestinationDir !== previousBasePath.slice(1, -1)
          ) {
            throw new Error(
              `Invalid deployed dev state: ${JSON.stringify({
                previousBasePath,
                previousDestinationDir,
              })}`
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `PREVIOUS_DEV_DESTINATION_DIR=${previousDestinationDir}\n`
          );
          NODE
      - name: Prepare Pages branch update
        shell: bash
        env:
          DEV_BASE_PATH: ${{ needs.gate.outputs.dev_base_path }}
          DEV_DESTINATION_DIR: ${{ needs.gate.outputs.destination_dir }}
        run: |
          rm -rf pages-publish
          mkdir -p pages-publish
          cp -a gh-pages-current/. pages-publish/
          rm -rf pages-publish/.git

          if [[ "$DEV_DESTINATION_DIR" != "${PREVIOUS_DEV_DESTINATION_DIR:-}" && ( -e "pages-publish/$DEV_DESTINATION_DIR" || -L "pages-publish/$DEV_DESTINATION_DIR" ) ]]; then
            echo "Dev Pages destination '$DEV_DESTINATION_DIR' overlaps existing root output." >&2
            exit 1
          fi

          if [[ -n "${PREVIOUS_DEV_DESTINATION_DIR:-}" && "$PREVIOUS_DEV_DESTINATION_DIR" != "$DEV_DESTINATION_DIR" ]]; then
            rm -rf "pages-publish/$PREVIOUS_DEV_DESTINATION_DIR"
          fi

          rm -rf "pages-publish/$DEV_DESTINATION_DIR"
          mkdir -p "pages-publish/$DEV_DESTINATION_DIR"
          cp -a apps/standalone/dist/. "pages-publish/$DEV_DESTINATION_DIR/"
          rm -f "pages-publish/$DEV_DESTINATION_DIR/CNAME"
          cp apps/standalone/dist/404.html pages-publish/404.html

          node <<'NODE'
          const fs = require('node:fs');
          const state = {
            devBasePath: process.env.DEV_BASE_PATH,
            devDestinationDir: process.env.DEV_DESTINATION_DIR,
          };
          fs.writeFileSync(
            'pages-publish/.skincrafter-pages-state.json',
            `${JSON.stringify(state, null, 2)}\n`,
            'utf8'
          );
          NODE
      - name: Deploy validated dev preview and root fallback
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-publish
          full_commit_message: "deploy(dev): ${{ github.event.workflow_run.head_sha }}"
