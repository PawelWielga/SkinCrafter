name: Finalize editor package scope

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.issue.title == 'Finalize @dihor editor scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify scope migration is complete
        shell: bash
        run: |
          if git grep -n -F '@pawelwielga/skincrafter-editor'; then
            echo 'Old editor package scope is still referenced.' >&2
            exit 1
          fi
          node -e "const p=require('./packages/editor/package.json'); if(p.name!=='@dihor/skincrafter-editor') process.exit(1)"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check:dead-code
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:consumer
      - name: Commit synchronized lockfile and remove finalizer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-editor-scope.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m 'chore: finalize @dihor editor package scope'
          git push origin HEAD:main
