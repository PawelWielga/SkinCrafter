name: GitHub | Actions Retention

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check_no_actions_cache.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check_no_actions_cache.py'
  schedule:
    - cron: '30 3 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-retention
  cancel-in-progress: false

jobs:
  cache-policy:
    name: Enforce no Actions cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Actions cache is disabled
        run: python .github/scripts/check_no_actions_cache.py

  cleanup:
    if: github.event_name != 'pull_request'
    needs: cache-policy
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            ids="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[]?.id')"
            [ -n "$ids" ] || break
            while read -r id; do
              [ -z "$id" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            done <<< "$ids"
          done

      - name: Delete Actions artifacts and runs older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '3 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts[]? | select(.created_at < \"${cutoff}\") | .id" | while read -r id; do [ -z "${id}" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; done
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" --jq ".workflow_runs[]? | select(.created_at < \"${cutoff}\") | .id" | while read -r id; do [ -z "${id}" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}"; done
