name: Remove issue 76 lockfile helper

on:
  push:
    branches: [fix/76-router-security]

permissions:
  contents: write

jobs:
  remove-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/76-router-security
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-lockfile.yml
          git commit -m "chore: remove lockfile normalization workflow"
          git push
