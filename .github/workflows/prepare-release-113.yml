name: Prepare editor release metadata

on:
  push:
    branches:
      - chore/113-release-1.0.0
    paths:
      - .github/workflows/prepare-release-113.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/113-release-1.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify release versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const editor = JSON.parse(readFileSync('packages/editor/package.json', 'utf8'));
          const standalone = JSON.parse(readFileSync('apps/standalone/package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (editor.version !== '1.0.0') throw new Error(`Unexpected editor version: ${editor.version}`);
          if (standalone.dependencies['@dihor/skincrafter-editor'] !== '1.0.0') throw new Error('Standalone dependency is not aligned to 1.0.0.');
          if (lock.packages['packages/editor'].version !== '1.0.0') throw new Error('Lockfile editor version is not 1.0.0.');
          if (lock.packages['apps/standalone'].dependencies['@dihor/skincrafter-editor'] !== '1.0.0') throw new Error('Lockfile standalone dependency is not aligned to 1.0.0.');
          NODE
      - name: Update install example
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'packages/editor/README.md';
          const before = 'npm install @dihor/skincrafter-editor@0.1.0 react@18 react-dom@18 three@0.178';
          const after = 'npm install @dihor/skincrafter-editor@1.0.0 react@18 react-dom@18 three@0.178';
          const source = readFileSync(path, 'utf8');
          const matches = source.split(before).length - 1;
          if (matches !== 1) throw new Error(`Expected one install example to update, found ${matches}.`);
          writeFileSync(path, source.replace(before, after));
          NODE
      - name: Remove one-off workflow and commit generated metadata
        run: |
          git rm .github/workflows/prepare-release-113.yml
          git add package-lock.json packages/editor/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize editor 1.0.0 release metadata"
          git push origin HEAD:chore/113-release-1.0.0
