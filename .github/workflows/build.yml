name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify legacy editor package scope is absent
        shell: bash
        run: |
          OLD_SCOPE='@pawelwielga'"/skincrafter-editor"
          if git grep -n -F "$OLD_SCOPE"; then
            echo "Legacy editor package scope is still referenced." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check:dead-code
      - run: npm test
      - name: Configure dev Pages base path
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: echo 'VITE_BASE_PATH=/dev/' >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:consumer
      - name: Upload validated standalone site
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/upload-artifact@v7
        with:
          name: standalone-pages-${{ github.sha }}
          path: apps/standalone/dist
          if-no-files-found: error
          retention-days: 1
