name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify legacy editor package scope is absent
        shell: bash
        run: |
          OLD_SCOPE='@pawelwielga'"/skincrafter-editor"
          if git grep -n -F "$OLD_SCOPE"; then
            echo "Legacy editor package scope is still referenced." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check:dead-code
      - run: npm test
      - run: npm run build
      - run: npm run test:consumer
