name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  migrate-issue-134-assets:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/migrate-issue-134-textures.py
      - name: Commit migrated binary assets
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/editor/src/assets/textures
          git commit -m "assets: split tintable and fixed texture layers"
          git push

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify legacy editor package scope is absent
        shell: bash
        run: |
          OLD_SCOPE='@pawelwielga'"/skincrafter-editor"
          if git grep -n -F "$OLD_SCOPE"; then
            echo "Legacy editor package scope is still referenced." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check:dead-code
      - run: npm test
      - run: npm run build
      - run: npm run test:consumer
