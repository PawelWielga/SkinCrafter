name: Temporary dependency cleanup

on:
  push:
    branches:
      - fix/mobile-hide-layer-drag-handle

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mobile-hide-layer-drag-handle
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm uninstall dragula -w @pawelwielga/skincrafter-editor
      - run: npm uninstall --save-dev @types/dragula
      - run: npm install --save-dev knip@^6.32.2
      - name: Commit synchronized manifests and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/editor/package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove stale dependencies and add dead-code tooling"
          git push origin HEAD:fix/mobile-hide-layer-drag-handle
