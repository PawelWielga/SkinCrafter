name: Rename editor npm scope

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-editor-scope.yml

permissions:
  contents: write

jobs:
  rename-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Rename package scope everywhere
        shell: bash
        run: |
          git grep -Il -F '@pawelwielga/skincrafter-editor' | while IFS= read -r file; do
            sed -i 's|@pawelwielga/skincrafter-editor|@dihor/skincrafter-editor|g' "$file"
          done
          npm install --package-lock-only --ignore-scripts
      - name: Verify old scope is gone
        shell: bash
        run: |
          if git grep -n -F '@pawelwielga/skincrafter-editor'; then
            echo 'Old package scope is still referenced.' >&2
            exit 1
          fi
          node -e "const p=require('./packages/editor/package.json'); if(p.name!=='@dihor/skincrafter-editor') process.exit(1)"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:consumer
      - name: Commit validated rename to main
        shell: bash
        run: |
          rm .github/workflows/rename-editor-scope.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: move editor package to @dihor scope'
          git push origin HEAD:main
