name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [Build, Test]
    branches: [main]
    types: [completed]

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.validation.outputs.ready }}
      build_run_id: ${{ steps.validation.outputs.build_run_id }}
    steps:
      - name: Verify full validation for the same main SHA
        id: validation
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;

            const { data: mainBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });

            if (mainBranch.commit.sha !== sha) {
              core.info(`Skipping ${sha}: main has already advanced to ${mainBranch.commit.sha}.`);
              core.setOutput('ready', 'false');
              return;
            }

            const requiredWorkflows = ['build.yml', 'test.yml'];
            const successfulRuns = new Map();

            for (const workflow_id of requiredWorkflows) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                branch: 'main',
                event: 'push',
                head_sha: sha,
                per_page: 10,
              });

              const run = data.workflow_runs
                .filter(candidate =>
                  candidate.head_sha === sha &&
                  candidate.head_branch === 'main' &&
                  candidate.event === 'push'
                )
                .sort((left, right) => new Date(right.updated_at) - new Date(left.updated_at))[0];

              if (!run) {
                core.info(`${workflow_id}: no push run found for ${sha}.`);
                core.setOutput('ready', 'false');
                return;
              }

              core.info(`${workflow_id}: ${run.status}/${run.conclusion} (run ${run.id}).`);

              if (run.status !== 'completed' || run.conclusion !== 'success') {
                core.setOutput('ready', 'false');
                return;
              }

              successfulRuns.set(workflow_id, run);
            }

            core.setOutput('ready', 'true');
            core.setOutput('build_run_id', String(successfulRuns.get('build.yml').id));

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout validated main source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          persist-credentials: false
      - name: Download validated standalone site
        uses: actions/download-artifact@v8
        with:
          name: standalone-pages-${{ github.event.workflow_run.head_sha }}
          path: source/apps/standalone/dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.build_run_id }}
      - name: Checkout current Pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-current
          persist-credentials: false
      - name: Resolve active dev preview
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const statePath = 'gh-pages-current/.skincrafter-pages-state.json';
          const fallbackPath = 'gh-pages-current/404.html';
          let devBasePath;
          let devDestinationDir;

          if (fs.existsSync(statePath)) {
            const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
            devBasePath = state.devBasePath;
            devDestinationDir = state.devDestinationDir;
          } else if (fs.existsSync(fallbackPath)) {
            const fallback = fs.readFileSync(fallbackPath, 'utf8');
            const previewMatch = fallback.match(/var previewBase = ['"]([^'"]+)['"];/);

            if (previewMatch) {
              devBasePath = previewMatch[1];
              devDestinationDir = devBasePath.slice(1, -1);
            }
          }

          if (devBasePath === undefined && devDestinationDir === undefined) {
            const config = JSON.parse(
              fs.readFileSync('source/apps/standalone/deployment.config.json', 'utf8')
            );
            devBasePath = config.dev?.basePath;
            devDestinationDir =
              typeof devBasePath === 'string' ? devBasePath.slice(1, -1) : undefined;
          }

          if (
            typeof devBasePath !== 'string' ||
            !/^\/[A-Za-z0-9._~-]+\/$/.test(devBasePath) ||
            devDestinationDir !== devBasePath.slice(1, -1)
          ) {
            throw new Error(
              `Invalid deployed dev state: ${JSON.stringify({ devBasePath, devDestinationDir })}`
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DEV_BASE_PATH=${devBasePath}\nDEV_DESTINATION_DIR=${devDestinationDir}\n`
          );
          NODE
      - name: Regenerate root fallback for the active dev preview
        shell: bash
        run: SKINCRAFTER_PAGES_PREVIEW_BASE_PATH="$DEV_BASE_PATH" node ./source/apps/standalone/scripts/create-pages-fallback.mjs
      - name: Preserve active dev preview and deployment state
        shell: bash
        run: |
          if [[ -d "gh-pages-current/$DEV_DESTINATION_DIR" ]]; then
            mkdir -p "source/apps/standalone/dist/$DEV_DESTINATION_DIR"
            cp -a "gh-pages-current/$DEV_DESTINATION_DIR/." "source/apps/standalone/dist/$DEV_DESTINATION_DIR/"
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const state = {
            devBasePath: process.env.DEV_BASE_PATH,
            devDestinationDir: process.env.DEV_DESTINATION_DIR,
          };
          fs.writeFileSync(
            'source/apps/standalone/dist/.skincrafter-pages-state.json',
            `${JSON.stringify(state, null, 2)}\n`,
            'utf8'
          );
          NODE
      - name: Deploy validated standalone site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./source/apps/standalone/dist
          full_commit_message: "deploy: ${{ github.event.workflow_run.head_sha }}"
