name: Publish editor package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'editor-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm ci
      - name: Verify release tag matches package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/editor/package.json').version")
          test "${{ github.event.release.tag_name }}" = "editor-v${VERSION}"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check:dead-code
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:consumer
      - name: Pack versioned npm-compatible artifact
        run: |
          mkdir -p artifacts
          npm pack -w @dihor/skincrafter-editor --pack-destination ./artifacts
      - name: Attach package tarball to GitHub release
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare npm trusted publishing runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Ensure trusted-publishing capable npm CLI
        run: npm install --global npm@^11.15.0
      - name: Publish public npm package
        run: npm publish -w @dihor/skincrafter-editor --access public --provenance
        env:
          # Optional fallback. Trusted Publishing via OIDC is preferred and works without this secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
